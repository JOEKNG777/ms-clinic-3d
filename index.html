<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSクリニック 3D模型試作</title><style>body{margin:0;background:#101b2c;color:#eef5ff;font-family:-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px}h1{font-size:21px}p{line-height:1.6;color:#c9d7e8}canvas{display:block;width:100%;height:390px;background:radial-gradient(circle at center,#253c55,#0b1524);border-radius:18px;touch-action:none}label{display:block;margin:18px 0 7px}input{width:100%}button{background:#2674dd;color:white;border:0;border-radius:12px;padding:13px 20px;font-size:16px;margin:10px 8px 0 0}small{color:#aebdd0}</style></head><body><main><h1>MSクリニック｜医療模型 試作版</h1><p>指で左右にドラッグして回転。スライダーで包皮の位置を変更できます。</p><canvas id="view"></canvas><label for="skin">包皮の移動：<output id="val">75</output>%</label><input id="skin" type="range" min="0" max="100" value="75"><div><button id="play">▶ 自動再生</button><button id="reset">初期位置</button></div><p id="status">操作待機中</p><small>教育用の概念模型です。実際の解剖・術式を正確に再現したものではありません。患者説明への利用前に医師の監修が必要です。</small></main><script>
const c=document.getElementById('view'),g=c.getContext('2d'),skin=document.getElementById('skin'),val=document.getElementById('val'),status=document.getElementById('status');let angle=.25,drag=false,last=0,playing=false,t=0;
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',resize);
function ellipse(x,y,rx,ry,fill,stroke){g.beginPath();g.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function draw(){const w=c.clientWidth,h=c.clientHeight;g.clearRect(0,0,w,h);g.save();g.translate(w/2,h/2+15);let a=angle,wide=.48+.52*Math.abs(Math.cos(a)),shift=Math.sin(a)*26,cover=+skin.value/100;g.shadowColor='#0008';g.shadowBlur=20;ellipse(shift,68,67*wide,155,'#d8a29a');g.shadowBlur=0;
const shaft=g.createLinearGradient(-80,0,80,0);shaft.addColorStop(0,'#b67e7b');shaft.addColorStop(.42,'#f1c5b5');shaft.addColorStop(1,'#a86f70');g.fillStyle=shaft;g.beginPath();g.moveTo(shift-58*wide,88);g.lineTo(shift-55*wide,-105);g.quadraticCurveTo(shift,-135,shift+55*wide,-105);g.lineTo(shift+58*wide,88);g.closePath();g.fill();
ellipse(shift,-110,56*wide,57,'#c78987','#9e676a');ellipse(shift,-144,22*wide,6,'#9f5f64');
let edge=-168+cover*165;g.fillStyle='#e5b1a4';g.beginPath();g.moveTo(shift-61*wide,115);g.lineTo(shift-60*wide,edge+20);g.quadraticCurveTo(shift-65*wide,edge,shift,edge);g.quadraticCurveTo(shift+65*wide,edge,shift+60*wide,edge+20);g.lineTo(shift+61*wide,115);g.closePath();g.fill();ellipse(shift,edge,60*wide,12,'#e7b4a6','#ac7a76');g.restore();
}
skin.addEventListener('input',()=>{val.textContent=skin.value;status.textContent='包皮位置 '+skin.value+'%';draw()});
c.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-last)*.015;last=e.clientX;draw()}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
document.getElementById('reset').onclick=()=>{playing=false;skin.value=75;val.textContent=75;angle=.25;status.textContent='初期位置に戻しました';document.getElementById('play').textContent='▶ 自動再生';draw()};
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'■ 停止':'▶ 自動再生';status.textContent=playing?'アニメーション再生中':'停止中'};
function loop(){if(playing){t+=.035;skin.value=Math.round(50+49*Math.sin(t));val.textContent=skin.value;draw()}requestAnimationFrame(loop)}resize();loop();</script></body></html>
