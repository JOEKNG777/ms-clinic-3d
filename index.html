<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSクリニック 3D解剖模型 v6</title><style>body{margin:0;background:#0d192a;color:#f1f6ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:750px;margin:auto;padding:16px}h1{font-size:22px}p{color:#cbd9e8;line-height:1.55}#view{height:420px;border-radius:18px;background:#1b3048;touch-action:none;overflow:hidden;position:relative}#view canvas{display:block;width:100%;height:100%}.tag{position:absolute;top:12px;left:12px;background:#0a192acc;padding:7px 10px;border-radius:8px;font-size:12px}label{display:block;margin:15px 0 7px}input[type=range]{width:100%}button,select{font-size:16px;border:0;border-radius:10px;padding:12px;background:#2674dd;color:white;margin:6px 5px 5px 0}button:disabled{opacity:.4}.card{background:#1b3048;border-radius:14px;padding:15px;margin:18px 0}small{color:#b7c8d9;line-height:1.6;display:block}</style></head><body><main><h1>MSクリニック｜3D医療模型 v6</h1><p>模型を指で回転できます。解剖学的な位置関係を確認するための3D試作です。</p><div id="view"><div class="tag">3D試作｜医師監修前</div></div><div class="card"><label>包皮の移動：<output id="val">70</output>%</label><input id="skin" type="range" min="0" max="100" value="70"><button id="reset">視点を戻す</button><button id="spin">▶ 自動回転</button></div><div class="card"><label>術式：<select id="method"><option>基本</option><option>精密</option><option>特別</option></select></label><h2 id="stageTitle" style="font-size:18px"></h2><p id="stageDesc"></p><input id="stage" type="range" min="0" max="5" value="0" step="1"><div><button id="prev">◀ 前へ</button><button id="next">次へ ▶</button><button id="auto">▶ 工程を再生</button></div></div><p id="status">3Dエンジンを読み込み中…</p><small>このモデルは教育用の概念模型であり、実際の陰茎解剖・切除形状・手術手技を忠実に再現したものではありません。特に術式の差は未実装です。患者説明への使用には医師の監修が必要です。</small></main><script type="module">\nimport * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/+esm";
(function(){const status=document.getElementById('status');if(!THREE.WebGLRenderer){status.textContent='3Dエンジンが利用できません。';return}
const T=THREE,box=document.getElementById('view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.1,100);camera.position.set(0,1,10);let renderer;try{renderer=new T.WebGLRenderer({antialias:true,alpha:true})}catch(e){status.textContent='この端末では3D表示を開始できません。WebGL対応ブラウザで開いてください。';return}renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));box.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x5a6070,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(4,6,8);scene.add(light);const group=new T.Group();scene.add(group);
const skinMat=new T.MeshStandardMaterial({color:0xdca89b,roughness:.8,side:T.DoubleSide}),glansMat=new T.MeshStandardMaterial({color:0xb9787a,roughness:.65}),edgeMat=new T.MeshStandardMaterial({color:0xf0c2b2,roughness:.75,side:T.DoubleSide}),lineMat=new T.MeshStandardMaterial({color:0x59d7e8,emissive:0x124e65}),sutureMat=new T.MeshStandardMaterial({color:0x4c7181});
function mesh(geo,mat){const m=new T.Mesh(geo,mat);group.add(m);return m}
const shaft=mesh(new T.CylinderGeometry(.85,.94,3.5,64),skinMat);shaft.position.y=-.6;
const glans=mesh(new T.SphereGeometry(.91,48,32),glansMat);glans.scale.set(1,.87,1);glans.position.y=1.35;
const meatus=mesh(new T.SphereGeometry(.09,24,12),new T.MeshStandardMaterial({color:0x884c58}));meatus.scale.set(.55,.25,1);meatus.position.set(0,2.12,.04);
const sleeve=mesh(new T.CylinderGeometry(.96,.98,2.2,64,1,true),skinMat);
const rim=mesh(new T.TorusGeometry(.965,.085,12,64),edgeMat);rim.rotation.x=Math.PI/2;
const band1=mesh(new T.TorusGeometry(.95,.035,8,64),lineMat),band2=mesh(new T.TorusGeometry(.95,.035,8,64),lineMat);band1.rotation.x=band2.rotation.x=Math.PI/2;
const stitches=[];for(let i=0;i<16;i++){let a=i*Math.PI/8,m=mesh(new T.BoxGeometry(.065,.16,.025),sutureMat);m.position.set(Math.sin(a)*.96,.1,Math.cos(a)*.96);m.rotation.y=a;stitches.push(m)}
// 小帯：腹側の位置を示す簡略化したマーカー。正確な解剖モデルではない。
const frenulum=mesh(new T.SphereGeometry(.13,16,12),edgeMat);frenulum.scale.set(.75,2,.45);frenulum.position.set(0,.8,-.91);
let angle=.4,pitch=.12,drag=false,x0=0,y0=0,autoSpin=false,step=0,playing=false,timer=null;
const names=['術前の状態','包皮を移動','切除範囲の確認','切除後の状態','縫合位置の確認','術後の概念図'],desc=['被覆された状態の概念図です。','包皮を後退させ、亀頭と小帯の位置を確認します。','切除予定位置を二本のラインで示します。','切除領域がなくなった状態を概念的に表現します。','接合位置と縫合糸を概念的に示します。','縫合後の外観を示します。完成形を保証するものではありません。'];
function update(){step=+document.getElementById('stage').value;const v=+document.getElementById('skin').value/100;document.getElementById('val').textContent=Math.round(v*100);document.getElementById('stageTitle').textContent=(step+1)+'/6｜'+names[step];document.getElementById('stageDesc').textContent=desc[step];const cover=step===0?v:step===1?Math.min(v,.18):step===2?.12:0;const top=-.85+cover*3.0;sleeve.visible=step<3;sleeve.scale.y=Math.max(.06,.7+cover*.25);sleeve.position.y=top-1.1*sleeve.scale.y;rim.visible=step<3;rim.position.y=top;band1.visible=band2.visible=step===2;band1.position.y=.25;band2.position.y=-.4;stitches.forEach(m=>m.visible=step>=4);frenulum.visible=true;status.textContent='3D表示中｜'+document.getElementById('method').value+'（術式差は未実装）'}
document.getElementById('skin').oninput=update;document.getElementById('stage').oninput=update;document.getElementById('method').onchange=update;document.getElementById('prev').onclick=()=>{document.getElementById('stage').value=Math.max(0,step-1);update()};document.getElementById('next').onclick=()=>{document.getElementById('stage').value=Math.min(5,step+1);update()};document.getElementById('reset').onclick=()=>{angle=.4;pitch=.12;autoSpin=false;document.getElementById('spin').textContent='▶ 自動回転'};document.getElementById('spin').onclick=()=>{autoSpin=!autoSpin;document.getElementById('spin').textContent=autoSpin?'■ 回転停止':'▶ 自動回転'};document.getElementById('auto').onclick=()=>{playing=!playing;document.getElementById('auto').textContent=playing?'■ 工程停止':'▶ 工程を再生';clearInterval(timer);if(playing){document.getElementById('stage').value=0;update();timer=setInterval(()=>{if(step===5){clearInterval(timer);playing=false;document.getElementById('auto').textContent='▶ 工程を再生'}else{document.getElementById('stage').value=step+1;update()}},1900)}};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;y0=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-x0)*.012;pitch=Math.max(-.7,Math.min(.7,pitch+(e.clientY-y0)*.008));x0=e.clientX;y0=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
function resize(){let w=box.clientWidth,h=box.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();update();function tick(){requestAnimationFrame(tick);if(autoSpin)angle+=.007;group.rotation.y=angle;group.rotation.x=pitch;renderer.render(scene,camera)}tick()})();
</script></body></html>
