<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSクリニック 3D解剖模型 v9</title><style>body{margin:0;background:#0d192a;color:#f1f6ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:750px;margin:auto;padding:16px}h1{font-size:22px}p{color:#cbd9e8;line-height:1.55}#view{height:clamp(280px,105vw,420px);border-radius:18px;background:#1b3048;touch-action:none;overflow:hidden;position:relative}#view canvas{display:block;width:100%;height:100%}.tag{pointer-events:none;position:absolute;top:12px;left:12px;background:#0a192acc;padding:7px 10px;border-radius:8px;font-size:12px}label{display:block;margin:15px 0 7px}input[type=range]{width:100%}button,select{font-size:16px;border:0;border-radius:10px;padding:12px;background:#2674dd;color:white;margin:6px 5px 5px 0}button:disabled{opacity:.4}.card{background:#1b3048;border-radius:14px;padding:15px;margin:18px 0}small{color:#b7c8d9;line-height:1.6;display:block}</style></head><body><main><h1>MSクリニック｜3D医療模型 v9</h1><p>仮性包茎の概念模型です。被覆スライダーで包皮を動かし、「小帯側を見る」で腹側から形を確認できます。</p><div id="view"><svg id="fallback" viewBox="0 0 240 200" width="100%" height="100%" role="img" aria-label="包皮の折り返しの概念断面図">
<path d="M65 165V65Q65 40 85 40" fill="none" stroke="#efba98" stroke-width="8"/>
<path d="M85 40Q105 40 105 65" fill="none" stroke="#ffe0ad" stroke-width="8"/>
<path d="M105 65V108" fill="none" stroke="#dc8ba5" stroke-width="8"/>
<g fill="white" font-size="12"><text x="120" y="47">折り返し</text><text x="120" y="91">内板</text><text x="79" y="145">外板</text></g></svg><div class="tag">3D試作｜医師監修前</div></div><div class="card"><label for="skin">包皮の被覆（概念）：<output id="val">70</output>%</label><input id="skin" type="range" min="0" max="100" value="70"><label><input id="section" type="checkbox" checked> 断面表示</label><p>外板は肌色、内板は赤紫、折り返しは淡い黄で示します。</p><button id="ventral">小帯側を見る</button><button id="reset">視点を戻す</button><button id="spin">▶ 自動回転</button></div><div class="card"><p>基本・精密・特別の術式差は、医師監修後に検討します。</p><h2 id="stageTitle" style="font-size:18px"></h2><p id="stageDesc"></p><input aria-label="概念模型の表示工程" id="stage" type="range" min="0" max="5" value="0" step="1"><div><button id="prev">◀ 前へ</button><button id="next">次へ ▶</button><button id="auto">▶ 工程を再生</button></div></div><p id="status" role="status">概念断面図を表示しています。3D表示にはJavaScriptとWebGLが必要です。</p><small>このモデルは教育用の概念模型であり、実際の陰茎解剖・切除形状・手術手技を忠実に再現したものではありません。特に術式の差は未実装です。患者説明への使用には医師の監修が必要です。</small></main><script>
const statusText = document.getElementById("status");
statusText.textContent = "3Dエンジンを読み込み中…";
import("https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js").then(THREE => {
const status=document.getElementById('status');if(!THREE.WebGLRenderer){status.textContent='3Dエンジンが利用できません。';return}
const T=THREE,box=document.getElementById('view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.1,100);camera.position.set(0,1,10);let renderer;try{renderer=new T.WebGLRenderer({antialias:true,alpha:true})}catch(e){status.textContent='この端末では3D表示を開始できません。WebGL対応ブラウザで開いてください。';return}renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));box.appendChild(renderer.domElement);
const fallback = document.getElementById("fallback");
fallback.style.display = "none";
renderer.domElement.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  renderer.domElement.style.display = "none";
  fallback.style.display = "";
  status.textContent = "3D表示が中断されたため、概念断面図を表示しています。";
});
renderer.domElement.addEventListener("webglcontextrestored", () => {
  renderer.domElement.style.display = "";
  fallback.style.display = "none";
  update();
});
scene.add(new T.HemisphereLight(0xffffff,0x5a6070,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(4,6,8);scene.add(light);const group=new T.Group();scene.add(group);
const skinMat=new T.MeshStandardMaterial({color:0xdca89b,roughness:.8,side:T.DoubleSide}),glansMat=new T.MeshStandardMaterial({color:0xb9787a,roughness:.65}),edgeMat=new T.MeshStandardMaterial({color:0xf0c2b2,roughness:.75,side:T.DoubleSide}),lineMat=new T.MeshStandardMaterial({color:0x59d7e8,emissive:0x124e65}),sutureMat=new T.MeshStandardMaterial({color:0x4c7181});
function mesh(geo,mat){const m=new T.Mesh(geo,mat);group.add(m);return m}
// Profiles run from the base toward the tip. The ventral side faces -Z.
function shapedLathe(profile, ventralSlope) {
  const geometry = new T.LatheGeometry(profile.map(([r, y]) => new T.Vector2(r, y)), 64);
  const points = geometry.attributes.position;
  for (let i = 0; i < points.count; i++) {
    const y = points.getY(i);
    points.setY(i, y + points.getZ(i) * ventralSlope(y));
  }
  geometry.computeVertexNormals();
  return geometry;
}
mesh(shapedLathe([
  [0, -2.35], [.94, -2.35], [.90, -2.13], [.87, -1.6], [.86, -.75],
  [.88, .1], [.85, .57], [.78, .77], [.76, 1.19], [0, 1.19]
], () => 0), skinMat);
mesh(shapedLathe([
  [0, .88], [.70, .88], [.81, .95], [.90, 1.04], [.94, 1.14],
  [.93, 1.24], [.90, 1.36], [.84, 1.54], [.74, 1.72], [.61, 1.87],
  [.46, 1.99], [.30, 2.07], [.15, 2.10], [0, 2.08]
], y => .19 * Math.max(0, Math.min(1, (1.85 - y) / .6))), glansMat);
const meatus = mesh(new T.SphereGeometry(.065, 24, 12), new T.MeshStandardMaterial({color: 0x884c58}));
meatus.scale.set(.4, .28, 1);
meatus.position.set(0, 2.085, -.045);
const layers = [0xefba98, 0xffe0ad, 0xdc8ba5].map(color => mesh(
  new T.BufferGeometry(), new T.MeshStandardMaterial({color, roughness: .8, side: T.DoubleSide})
));
const section = document.getElementById("section");
function updateForeskin(cover, visible) {
  layers.forEach(layer => layer.visible = visible);
  if (!visible) return;

  // Shared profile endpoints keep both layers joined to the rounded fold.
  const lip = 1.0 + cover * 1.25;
  const outer = [
    new T.Vector2(.96, -2.24), new T.Vector2(.94, -.9),
    new T.Vector2(.96 + (1 - cover) * .10, lip - .22), new T.Vector2(1.04, lip)
  ];
  const fold = Array.from({length: 13}, (_, i) => {
    const angle = i * Math.PI / 12;
    return new T.Vector2(.995 + .045 * Math.cos(angle), lip + .045 * Math.sin(angle));
  });
  const inner = [fold[12], new T.Vector2(.95, Math.min(1.02, (lip + .82) / 2)), new T.Vector2(.86, .82)];
  outer[outer.length - 1] = fold[0];
  const gap = section.checked ? Math.PI / 2 : 0;
  [outer, fold, inner].forEach((profile, i) => {
    layers[i].geometry.dispose();
    layers[i].geometry = new T.LatheGeometry(profile, 64, gap / 2, 2 * Math.PI - gap);
  });
}
section.addEventListener("change", update);
const band1=mesh(new T.TorusGeometry(.95,.035,8,64),lineMat),band2=mesh(new T.TorusGeometry(.95,.035,8,64),lineMat);band1.rotation.x=band2.rotation.x=Math.PI/2;
const stitches=[];for(let i=0;i<16;i++){let a=i*Math.PI/8,m=mesh(new T.BoxGeometry(.065,.16,.025),sutureMat);m.position.set(Math.sin(a)*.96,.1,Math.cos(a)*.96);m.rotation.y=a;stitches.push(m)}
// A tapered surface follows the ventral junction from glans to inner plate.
const frenulumGeometry = new T.BufferGeometry();
const frenulumPositions = new Float32Array(27);
frenulumGeometry.setAttribute("position", new T.BufferAttribute(frenulumPositions, 3));
frenulumGeometry.setIndex([0, 3, 1, 1, 3, 4, 1, 4, 2, 2, 4, 5,
                           3, 6, 4, 4, 6, 7, 4, 7, 5, 5, 7, 8]);
const frenulum = mesh(frenulumGeometry, edgeMat);
function updateFrenulum(cover, visible) {
  frenulum.visible = visible && cover < .78;
  const profiles = [
    {y: 1.39, width: .035, depth: .892, ridge: .014},
    {y: 1.08, width: .075, depth: .927, ridge: .025},
    {y: .82 + cover * .16, width: .15, depth: .866, ridge: .012}
  ];
  profiles.forEach(({y, width, depth, ridge}, row) => {
    frenulumPositions.set([-width, y, -depth, 0, y, -depth - ridge, width, y, -depth], row * 9);
  });
  frenulumGeometry.attributes.position.needsUpdate = true;
  frenulumGeometry.computeVertexNormals();
  frenulumGeometry.computeBoundingSphere();
}
let angle=.4,pitch=.12,drag=false,x0=0,y0=0,autoSpin=false,step=0,playing=false,timer=null;
const names=['術前の状態','包皮を移動','切除範囲の確認','切除後の状態','縫合位置の確認','術後の概念図'],desc=['被覆された状態の概念図です。','包皮を後退させ、亀頭と包皮の位置関係を確認します。','切除予定位置を二本のラインで示します。','切除領域がなくなった状態を概念的に表現します。','接合位置と縫合糸を概念的に示します。','縫合後の外観を示します。完成形を保証するものではありません。'];
function update(){step=+document.getElementById('stage').value;const v=+document.getElementById('skin').value/100;document.getElementById('val').textContent=Math.round(v*100);document.getElementById('stageTitle').textContent=(step+1)+'/6｜'+names[step];document.getElementById('stageDesc').textContent=desc[step];const cover=step===0?v:step===1?Math.min(v,.18):step===2?.12:0;updateForeskin(cover, step < 3);band1.visible=band2.visible=step===2;band1.position.y=.25;band2.position.y=-.4;stitches.forEach(m=>m.visible=step>=4);updateFrenulum(cover, step < 3);if (!renderer.getContext().isContextLost()) status.textContent='3D表示中｜医師監修前の概念模型'}
document.getElementById('skin').oninput=update;document.getElementById('stage').oninput=update;document.getElementById('prev').onclick=()=>{document.getElementById('stage').value=Math.max(0,step-1);update()};document.getElementById('next').onclick=()=>{document.getElementById('stage').value=Math.min(5,step+1);update()};document.getElementById('ventral').onclick=()=>{
  angle=Math.PI;pitch=.04;autoSpin=false;
  document.getElementById('spin').textContent='▶ 自動回転';
};document.getElementById('reset').onclick=()=>{angle=.4;pitch=.12;autoSpin=false;document.getElementById('spin').textContent='▶ 自動回転'};document.getElementById('spin').onclick=()=>{autoSpin=!autoSpin;document.getElementById('spin').textContent=autoSpin?'■ 回転停止':'▶ 自動回転'};document.getElementById('auto').onclick=()=>{playing=!playing;document.getElementById('auto').textContent=playing?'■ 工程停止':'▶ 工程を再生';clearInterval(timer);if(playing){document.getElementById('stage').value=0;update();timer=setInterval(()=>{if(step===5){clearInterval(timer);playing=false;document.getElementById('auto').textContent='▶ 工程を再生'}else{document.getElementById('stage').value=step+1;update()}},1900)}};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;y0=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-x0)*.012;pitch=Math.max(-.7,Math.min(.7,pitch+(e.clientY-y0)*.008));x0=e.clientX;y0=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
function resize(){let w=box.clientWidth,h=box.clientHeight;camera.aspect=w/h;camera.position.z=Math.max(10, 6/camera.aspect);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();update();function tick(){requestAnimationFrame(tick);if(autoSpin)angle+=.007;group.rotation.y=angle;group.rotation.x=pitch;renderer.render(scene,camera)}tick();
}).catch(() => {
  document.querySelector("#view canvas")?.remove();
  document.getElementById("fallback").style.display = "";
  statusText.textContent = "3D表示を開始できないため、概念断面図を表示しています。";
});
</script></body></html>
